# Local copy of ucsb-cs156/workflows/.github/workflows/10-backend-unit.yml
# at ef85477a255e7590426ed79f73eab3c7d50f4ea4, pinned to Ubuntu 22.04
# for embedded MongoDB compatibility.

name: "10-backend-unit: Java Unit tests"

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: true
    inputs:
      JAVA_DISTRIBUTION:
        required: false
        type: string
        default: "temurin"
      TIMEOUT:
        required: false
        type: number
        default: 10

permissions:
  contents: write
  pages: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ inputs.TIMEOUT }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java (version from .java-version file)
        uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.JAVA_DISTRIBUTION }}
          java-version-file: ./.java-version
          cache: "maven"
          cache-dependency-path: "pom.xml"

      - name: Build with Maven
        run: mvn -ntp -B test
